name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Create Capacitor project
        run: |
          mkdir www
          cp "$(ls calc-*.html | sort -V | tail -1)" www/index.html
          npm init -y
          npm install @capacitor/core@^7 @capacitor/cli@^7 @capacitor/android@^7 @capacitor/app-launcher@^7
          npx cap init "Калькулятор" com.example.calc --web-dir www
          npx cap add android
          sed -i 's#</manifest>#    <uses-permission android:name="android.permission.QUERY_ALL_PACKAGES" />\n    <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW" />\n    <uses-permission android:name="android.permission.KILL_BACKGROUND_PROCESSES" />\n</manifest>#' android/app/src/main/AndroidManifest.xml
          D=android/app/src/main/java/com/example/calc
          mkdir -p $D
          cp "$(ls plugin-*.java | sort -V | tail -1)" $D/LaunchPlugin.java
          cp "$(ls service-*.java | sort -V | tail -1)" $D/ClickService.java
          mkdir -p android/app/src/main/res/xml android/app/src/main/res/values
          cat > android/app/src/main/res/xml/accessibility_service_config.xml << 'EOF3'
          <?xml version="1.0" encoding="utf-8"?>
          <accessibility-service xmlns:android="http://schemas.android.com/apk/res/android"
            android:accessibilityEventTypes="typeWindowStateChanged"
            android:accessibilityFeedbackType="feedbackGeneric"
            android:canPerformGestures="true"
            android:description="@string/click_desc"
            android:notificationTimeout="100" />
          EOF3
          cat > android/app/src/main/res/values/click_strings.xml << 'EOF3'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
            <string name="click_desc">Автоклікер: виконує натискання на екрані за вашою командою. Вміст екрана не читається.</string>
          </resources>
          EOF3
          sed -i 's#</application>#    <service android:name=".ClickService" android:label="Калькулятор: автоклікер" android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE" android:exported="true"><intent-filter><action android:name="android.accessibilityservice.AccessibilityService" /></intent-filter><meta-data android:name="android.accessibilityservice" android:resource="@xml/accessibility_service_config" /></service>\n</application>#' android/app/src/main/AndroidManifest.xml
          cat > $D/MainActivity.java << 'EOF2'
          package com.example.calc;

          import android.os.Bundle;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
            @Override
            public void onCreate(Bundle savedInstanceState) {
              registerPlugin(LaunchPlugin.class);
              super.onCreate(savedInstanceState);
            }
          }
          EOF2
          npx cap sync android
      - name: Build APK
        working-directory: android
        run: ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: calculator-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
