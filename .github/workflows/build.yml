name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Create Capacitor project
        run: |
          mkdir www
          cp index.html www/index.html
          npm init -y
          npm install @capacitor/core@^7 @capacitor/cli@^7 @capacitor/android@^7 @capacitor/app-launcher@^7
          npx cap init "Калькулятор" com.example.calc --web-dir www
          npx cap add android
          sed -i 's#</manifest>#    <uses-permission android:name="android.permission.QUERY_ALL_PACKAGES" />\n</manifest>#' android/app/src/main/AndroidManifest.xml
          npx cap sync android
      - name: Build APK
        working-directory: android
        run: ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: calculator-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
