<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Калькулятор</title>
<style>
:root{--bg:#111;--panel:#1b1b1f;--key:#2a2a30;--op:#ff9f0a;--fn:#4a4a52;--tx:#fff;--mut:#8a8a93;--ok:#30d158;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#f2f2f7;--panel:#fff;--key:#fff;--fn:#d1d1d6;--tx:#111;--mut:#6b6b73}}
:root[data-theme="light"]{--bg:#f2f2f7;--panel:#fff;--key:#fff;--fn:#d1d1d6;--tx:#111;--mut:#6b6b73}
:root[data-theme="dark"]{--bg:#111;--panel:#1b1b1f;--key:#2a2a30;--fn:#4a4a52;--tx:#fff;--mut:#8a8a93}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,Roboto,sans-serif;display:flex;flex-direction:column;-webkit-user-select:none;user-select:none}
#disp{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:flex-end;padding:16px 22px;min-height:0}
#ex{color:var(--mut);font-size:22px;min-height:28px;word-break:break-all;text-align:right}
#res{font-size:56px;font-weight:300;word-break:break-all;text-align:right}
#pad{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;padding:14px;max-width:480px;width:100%;box-sizing:border-box;margin:0 auto}
#pad button{height:min(17vw,76px);border:0;border-radius:50px;font-size:28px;background:var(--key);color:var(--tx)}
#pad button:active{filter:brightness(1.4)}
#pad .f{background:var(--fn)}#pad .o{background:var(--op);color:#fff}
.ov{position:fixed;inset:0;background:var(--bg);display:none;flex-direction:column;padding:calc(14px + env(safe-area-inset-top,0px)) 16px calc(14px + env(safe-area-inset-bottom,0px));overflow:auto;z-index:9}
.ov.on{display:flex}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.top h2{margin:0;font-size:22px}
.btn{background:var(--op);color:#fff;border:0;border-radius:12px;padding:10px 16px;font-size:16px}
.btn.g{background:var(--fn);color:var(--tx)}
.tabs{display:flex;gap:8px;margin-bottom:12px}
.tabs .btn{flex:1;background:var(--fn);color:var(--tx)}.tabs .btn.a{background:var(--op);color:#fff}
.card{background:var(--panel);border-radius:14px;padding:12px;margin-bottom:10px;display:flex;gap:10px;align-items:center;justify-content:space-between}
.card span{flex:1;word-break:break-word}
input,textarea,select{width:100%;box-sizing:border-box;background:var(--panel);color:var(--tx);border:1px solid var(--fn);border-radius:10px;padding:10px;font-size:16px;margin-bottom:8px;font-family:inherit;-webkit-user-select:text;user-select:text}
label{display:block;color:var(--mut);font-size:14px;margin:10px 0 4px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.tile{background:var(--panel);border-radius:16px;padding:16px 6px;text-align:center;border:0;color:var(--tx);font-size:14px;position:relative}.tile i{display:block;font-style:normal;font-size:30px;margin-bottom:6px}.tile.last{outline:2px solid var(--op)}.tile .x{position:absolute;top:2px;right:8px;color:var(--mut);padding:4px}
.tile img{width:100%;height:84px;object-fit:cover;border-radius:10px;margin-bottom:6px;display:block}.tile small{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#disp{position:relative}#fb{position:absolute;top:10px;left:14px;padding:8px 12px;font-size:14px}
.pr{display:flex;gap:6px;margin-bottom:8px}.pr>*{margin:0;width:auto;min-width:0}.pq{flex:2}.pv{flex:1.4}.pu{flex:1.1}
#tm{flex-wrap:wrap}#tm .btn{flex:1 0 28%}
.agrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(80px,1fr));gap:16px 8px;margin:14px 0;background:var(--panel);border-radius:24px;padding:18px 10px}
.app{background:none;border:0;color:var(--tx);display:flex;flex-direction:column;align-items:center;gap:7px;position:relative;padding:2px 0;font-size:13px;min-width:0}
.app .ico{width:60px;height:60px;border-radius:18px;display:flex;align-items:center;justify-content:center;font-size:30px;color:#fff;font-weight:600;box-shadow:0 6px 14px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.28);transition:transform .12s}
.app:active .ico{transform:scale(.92)}
.app .nm{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.app.last .ico{outline:3px solid var(--op);outline-offset:3px}
.app.add .ico{background:transparent;box-shadow:none;border:2px dashed var(--mut);color:var(--mut)}
.app .x{display:none;position:absolute;top:-4px;right:4px;width:22px;height:22px;border-radius:50%;background:#ff453a;color:#fff;font-size:12px;align-items:center;justify-content:center;z-index:2;box-shadow:0 2px 6px rgba(0,0,0,.4)}
.agrid.edit .x{display:flex}
.agrid.edit .app:not(.add) .ico{animation:wig .3s infinite alternate}
@keyframes wig{from{transform:rotate(-2.5deg)}to{transform:rotate(2.5deg)}}
#aed.on{background:var(--op);color:#fff}
#tm .btn{border-radius:999px;padding:8px 10px;font-size:14px}
#msg{color:var(--ok);font-size:14px;min-height:18px}
</style>
</head>
<body>
<div id="disp"><button class="btn g" id="fb">ƒ Формули</button><div id="ex"></div><div id="res">0</div></div>
<div id="pad"></div>

<div class="ov" id="vault">
  <div class="top"><h2>🔐 Сейф</h2><button class="btn g" data-close>Закрити</button></div>
  <button class="btn g" id="toapps" style="margin-bottom:12px">📱 Програми</button>
  <div class="tabs"><button class="btn a" data-vt="n">Нотатки</button><button class="btn" data-vt="f">Фото й файли</button></div>
  <div id="tnotes"><textarea id="nt" rows="3" placeholder="Нова нотатка"></textarea><button class="btn" id="addn">Додати</button><div id="nl" style="margin-top:12px"></div></div>
  <div id="tfiles" style="display:none"><input type="file" id="fi" multiple hidden><button class="btn" id="addf">+ Додати файли</button><div id="fl" class="grid" style="margin-top:12px"></div></div>
  
</div>

<div class="ov" id="phys">
  <div class="top"><h2>ƒ Формули</h2><button class="btn g" data-close>Закрити</button></div>
  <select id="fs"></select>
  <div id="ff" style="margin-top:8px;color:var(--mut)"></div>
  <div id="fv" style="margin-top:6px"></div>
  <div style="display:flex;gap:8px;margin-top:8px"><button class="btn" id="fc" style="flex:1">Порахувати</button><button class="btn g" id="fx">Очистити</button></div>
  <div id="fr" style="margin-top:14px;font-size:18px"></div>
</div>

<div class="ov" id="prob">
  <div class="top"><h2>📝 Задача</h2><button class="btn g" data-close>Закрити</button></div>
  <b>Дано</b>
  <div id="pg" style="margin-top:8px"></div>
  <button class="btn g" id="pa">+ Додати дано</button>
  <div style="margin:14px 0 6px"><b>Знайти</b></div>
  <div class="pr"><select id="pt" class="pq"></select><select id="ptu" class="pu"></select></div>
  <div style="display:flex;gap:8px;margin-top:6px"><button class="btn" id="ps" style="flex:1">Розв’язати</button><button class="btn g" id="px">Очистити</button></div>
  <div id="po" class="card" style="display:block;white-space:pre-wrap;margin-top:14px;font-size:16px"></div>
</div>

<div class="ov" id="viewer">
  <div class="top"><h2 id="vt" style="font-size:16px;word-break:break-all"></h2><button class="btn g" data-close>Закрити</button></div>
  <div id="vb"></div>
</div>

<div class="ov" id="appsv">
  <div class="top"><h2>📱 Програми</h2><div style="display:flex;gap:8px"><button class="btn g" id="aed">✎ Змінити</button><button class="btn g" data-close>Закрити</button></div></div>
  <label style="margin-top:0">Таймер: через скільки повернути в калькулятор</label>
  <div class="tabs" id="tm"><button class="btn" data-tm="0">Без</button><button class="btn" data-tm="60">1 хв</button><button class="btn" data-tm="300">5 хв</button><button class="btn" data-tm="900">15 хв</button><button class="btn" data-tm="1800">30 хв</button><button class="btn" data-tm="3600">1 год</button></div>
  <input id="tmc" inputmode="numeric" placeholder="Або свій час у хвилинах">
  <div class="agrid" id="al"></div>
  <div id="msg" style="margin-top:10px"></div>
  <div id="af" style="display:none"><label>Нова програма</label>
  <input id="an" placeholder="Назва, напр. Камера"><input id="ap" placeholder="Пакет, напр. com.android.camera"><input id="ae" placeholder="Іконка-емодзі (необов’язково), напр. 📷">
  <button class="btn" id="adda">Додати</button></div>
</div>

<div class="ov" id="sett">
  <div class="top"><h2>⚙️ Налаштування</h2><button class="btn g" data-close>Закрити</button></div>
  <label>Код сейфа (3–8 цифр)</label><input id="c1" inputmode="numeric" maxlength="8">
  <label>Код налаштувань (3–8 цифр)</label><input id="c2" inputmode="numeric" maxlength="8">
  <label>Код екрана програм (3–8 цифр)</label><input id="c3" inputmode="numeric" maxlength="8">
  <label>Код розв’язувача задач (3–8 цифр)</label><input id="c4" inputmode="numeric" maxlength="8">
  <label>Код фальшивого сейфа (3–8 цифр)</label><input id="c5" inputmode="numeric" maxlength="8">
  <label>Тема</label>
  <div class="tabs"><button class="btn" data-th="auto">Авто</button><button class="btn" data-th="dark">Темна</button><button class="btn" data-th="light">Світла</button></div>
  <label>Ховати запущені програми зі списку останніх</label>
  <div class="tabs"><button class="btn" data-hd="1">Увімк</button><button class="btn" data-hd="0">Вимк</button></div>
  <label>Ховати сам калькулятор зі списку останніх</label>
  <div class="tabs"><button class="btn" data-hs="1">Увімк</button><button class="btn" data-hs="0">Вимк</button></div>
  <label>Кнопка «назад у калькулятор» поверх програм</label>
  <div class="tabs"><button class="btn" data-bk="1">Увімк</button><button class="btn" data-bk="0">Вимк</button></div>
  <div id="bkm" style="color:var(--mut);font-size:13px"></div>
  <label>Автоблокування за бездіяльності</label>
  <div class="tabs"><button class="btn" data-id="0">Вимк</button><button class="btn" data-id="15">15 с</button><button class="btn" data-id="60">1 хв</button><button class="btn" data-id="300">5 хв</button></div>
  <label>Блокування після помилок коду</label>
  <div class="tabs"><button class="btn" data-lk="1">Увімк</button><button class="btn" data-lk="0">Вимк</button></div>
  <label>Помилок до блокування</label>
  <div class="tabs"><button class="btn" data-ln="3">3</button><button class="btn" data-ln="5">5</button><button class="btn" data-ln="10">10</button></div>
  <label>Час блокування</label>
  <div class="tabs"><button class="btn" data-lm="1">1 хв</button><button class="btn" data-lm="5">5 хв</button><button class="btn" data-lm="30">30 хв</button></div>
  <div style="height:12px"></div>
  <button class="btn" id="save">Зберегти</button>
  <div id="smsg" style="color:var(--ok);margin-top:8px"></div>
</div>

<script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const D={c1:'1111',c2:'0000',c3:'2222',last:'',hide:true,hideself:false,back:false,timer:0,c4:'12345',c5:'9999',dn:['Купити: хліб, молоко, яйця, сир','Скинути сестрі рецепт борщу','Записати показники лічильників','Подивитись фільм на вихідних'],idle:60,lkOn:true,lkN:5,lkMin:5,fails:0,until:0,theme:'auto',notes:[],apps:[
{n:'Chrome',p:'com.android.chrome'},{n:'YouTube',p:'com.google.android.youtube'},{n:'Telegram',p:'org.telegram.messenger'},{n:'Налаштування',p:'com.android.settings'}]};
let S;
function load(){try{S=Object.assign({},D,JSON.parse(localStorage.getItem('calc')||'{}'))}catch(e){S=Object.assign({},D)}}
function save(){try{localStorage.setItem('calc',JSON.stringify(S))}catch(e){}}
load();
function theme(){const r=document.documentElement;S.theme==='auto'?r.removeAttribute('data-theme'):r.setAttribute('data-theme',S.theme)}
theme();

const keys=[['C','f'],['⌫','f'],['%','f'],['÷','o'],['7'],['8'],['9'],['×','o'],['4'],['5'],['6'],['−','o'],['1'],['2'],['3'],['+','o'],['±','f'],['0'],['.'],['=','o']];
const pad=$('#pad');
keys.forEach(([k,c])=>{const b=document.createElement('button');b.textContent=k;if(c)b.className=c;b.onclick=()=>press(k);pad.appendChild(b)});

let ex='';
function show(r){$('#ex').textContent=ex;if(r!==undefined)$('#res').textContent=r}
function calc(s){
  const e=s.replace(/×/g,'*').replace(/÷/g,'/').replace(/−/g,'-');
  if(!/^[0-9+\-*/.() ]+$/.test(e))return 'Помилка';
  try{const v=Function('"use strict";return ('+e+')')();
    if(!isFinite(v))return 'Помилка';return String(+v.toPrecision(12))}catch(x){return 'Помилка'}
}
function press(k){
  const ops='+−×÷';
  if(k==='C'){ex='';show('0')}
  else if(k==='⌫'){ex=ex.slice(0,-1);show(ex?calc(ex.replace(/[+−×÷.]$/,'')):'0')}
  else if(k==='='){
    if(/^\d+$/.test(ex)){
      const now=Date.now(),locked=S.lkOn&&S.until>now;
      const hit=ex===S.c1?'vault':ex===S.c2?'sett':ex===S.c3?'appsv':ex===S.c4?'prob':ex===S.c5?'decoy':'';
      if(hit&&!locked){S.fails=0;save();ex='';show('0');open(hit);return}
      if(S.lkOn&&ex.length>=3&&!locked){S.fails=(S.fails||0)+1;if(S.fails>=S.lkN){S.until=now+S.lkMin*60000;S.fails=0}save()}
    }else if(/[+−×÷]/.test(ex)&&S.fails){S.fails=0;save()}
    const r=calc(ex.replace(/[+−×÷.]$/,'')||'0');ex=r==='Помилка'?'':r;show(r)
  }
  else if(k==='±'){const m=ex.match(/(-?[\d.]+)$/);if(m){ex=ex.slice(0,m.index)+(m[1][0]==='-'?m[1].slice(1):'-'+m[1]);show(calc(ex))}}
  else if(k==='%'){const m=ex.match(/([\d.]+)$/);if(m){ex=ex.slice(0,m.index)+(+m[1]/100);show(calc(ex))}}
  else if(ops.includes(k)){if(!ex)return;if(ops.includes(ex.slice(-1)))ex=ex.slice(0,-1);ex+=k;show()}
  else{ex+=k;const t=ex.replace(/[+−×÷.]$/,'');show(/[+−×÷]/.test(ex)?calc(t):ex)}
}

let dec=false,FS='f';
function NL(){return dec?S.dn:S.notes}
function open(id){
  let o=id;
  if(id==='decoy'){dec=true;FS='d';o='vault'}else if(id==='vault'){dec=false;FS='f'}
  $('#'+o).classList.add('on');bump();
  if(o==='vault'){$('#toapps').style.display=dec?'none':'';$('[data-vt="n"]').click();notes()}
  if(o==='appsv'){$('#al').classList.remove('edit');$('#aed').classList.remove('on');$('#af').style.display='none';apps();tmFill()}
  if(o==='sett')fill()}
$$('[data-close]').forEach(b=>b.onclick=()=>b.closest('.ov').classList.remove('on'));
$('#toapps').onclick=()=>{$('#vault').classList.remove('on');open('appsv')};

function esc(s){return s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function notes(){
  $('#nl').innerHTML=NL().map((n,i)=>'<div class="card"><span>'+esc(n)+'</span><button class="btn g" data-dn="'+i+'">✕</button></div>').join('')||'<div style="color:var(--mut)">Нотаток ще немає</div>';
  $$('[data-dn]').forEach(b=>b.onclick=()=>{NL().splice(+b.dataset.dn,1);save();notes()});
}
$('#addn').onclick=()=>{const v=$('#nt').value.trim();if(v){NL().unshift(v);$('#nt').value='';save();notes()}};

const AE={'com.android.chrome':'🌐','com.google.android.youtube':'▶️','org.telegram.messenger':'✈️','com.android.settings':'⚙️'};
function hue(s){let h=0;for(const c of s)h=(h*31+c.charCodeAt(0))%360;return h}
function appHtml(a,i){const e=a.e||AE[a.p]||(a.n[0]||'?').toUpperCase(),u=hue(a.n);
  return '<button class="app'+(a.p===S.last?' last':'')+'" data-ra="'+i+'"><span class="x" data-da="'+i+'">✕</span><span class="ico" style="background:linear-gradient(145deg,hsl('+u+' 80% 62%),hsl('+((u+40)%360)+' 75% 45%))">'+esc(e)+'</span><span class="nm">'+esc(a.n)+'</span></button>'}
function apps(){
  $('#al').innerHTML=S.apps.map(appHtml).join('')+'<button class="app add" id="aadd"><span class="ico">＋</span><span class="nm">Додати</span></button>';
  $('#aadd').onclick=()=>{const f=$('#af');f.style.display=f.style.display==='none'?'':'none'};
  $$('[data-ra]').forEach(b=>b.onclick=()=>{if($('#al').classList.contains('edit'))return;launch(S.apps[+b.dataset.ra])});
  $$('[data-da]').forEach(b=>b.onclick=e=>{e.stopPropagation();S.apps.splice(+b.dataset.da,1);save();apps()});
}
let pick=0,DB,URLS=[];
function idb(){return new Promise((res,rej)=>{if(DB)return res(DB);const r=indexedDB.open('vault',2);r.onupgradeneeded=()=>{const db=r.result;['f','d'].forEach(n=>{if(!db.objectStoreNames.contains(n))db.createObjectStore(n,{keyPath:'id',autoIncrement:true})})};r.onsuccess=()=>{DB=r.result;res(DB)};r.onerror=()=>rej(r.error)})}
async function fAll(){const d=await idb();return new Promise((res,rej)=>{const q=d.transaction(FS).objectStore(FS).getAll();q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)})}
async function fAdd(f){const d=await idb();return new Promise((res,rej)=>{const t=d.transaction(FS,'readwrite');t.objectStore(FS).add({name:f.name,type:f.type||'',size:f.size,blob:f,t:Date.now()});t.oncomplete=res;t.onerror=()=>rej(t.error)})}
async function fDel(id){const d=await idb();return new Promise(res=>{const t=d.transaction(FS,'readwrite');t.objectStore(FS).delete(id);t.oncomplete=res})}
async function files(){
  URLS.forEach(u=>URL.revokeObjectURL(u));URLS=[];
  let a=[];try{a=await fAll()}catch(e){$('#fl').textContent='Сховище недоступне';return}
  a.sort((x,y)=>y.t-x.t);
  $('#fl').innerHTML=a.map(f=>{let u='';if(f.type.startsWith('image/')){u=URL.createObjectURL(f.blob);URLS.push(u)}
    return '<button class="tile" data-f="'+f.id+'"><span class="x" data-fd="'+f.id+'">✕</span>'+(u?'<img src="'+u+'">':'<i>📄</i>')+'<small>'+esc(f.name)+'</small></button>'}).join('')||'<div style="color:var(--mut)">Файлів ще немає</div>';
  $$('[data-fd]').forEach(b=>b.onclick=async e=>{e.stopPropagation();await fDel(+b.dataset.fd);files()});
  $$('[data-f]').forEach(b=>b.onclick=()=>showF(a.find(f=>f.id===+b.dataset.f)));
}
function showF(f){
  const u=URL.createObjectURL(f.blob);URLS.push(u);const t=f.type;
  $('#vt').textContent=f.name;
  $('#vb').innerHTML=(t.startsWith('image/')?'<img src="'+u+'" style="max-width:100%">':t.startsWith('video/')?'<video src="'+u+'" controls style="max-width:100%"></video>':t.startsWith('audio/')?'<audio src="'+u+'" controls></audio>':'<p>'+esc(f.name)+' ('+Math.round(f.size/1024)+' КБ)</p>')+'<p><a class="btn" download="'+esc(f.name)+'" href="'+u+'">Зберегти копію</a></p>';
  $('#viewer').classList.add('on');
}
$('#addf').onclick=()=>{pick=1;$('#fi').click()};
$('#fi').onchange=async()=>{try{for(const f of $('#fi').files)await fAdd(f)}catch(e){}$('#fi').value='';pick=0;files()};
window.addEventListener('focus',()=>setTimeout(()=>{pick=0},1500));
$$('[data-vt]').forEach(b=>b.onclick=()=>{const f=b.dataset.vt==='f';$('#tnotes').style.display=f?'none':'';$('#tfiles').style.display=f?'':'none';$$('[data-vt]').forEach(x=>x.classList.toggle('a',x===b));if(f)files()});
$$('[data-bk]').forEach(b=>b.onclick=async()=>{S.back=b.dataset.bk==='1';save();fill();
  if(S.back&&native()){try{const r=await plug().canOverlay();if(!r.ok){await plug().askOverlay();$('#bkm').textContent='Увімкни для калькулятора «Показувати поверх інших програм» і повернись'}}catch(e){$('#bkm').textContent='Помилка: '+((e&&e.message)||'')}}});
$$('[data-id]').forEach(b=>b.onclick=()=>{S.idle=+b.dataset.id;save();fill();bump()});

const FM=[
 {n:'Швидкість',f:'v = s / t',t:'q',r:['v','Швидкість','м/с'],x:['s','Шлях','м'],y:['t','Час','с']},
 {n:'Прискорення',f:'a = v / t',t:'q',r:['a','Прискорення','м/с²'],x:['v','Зміна швидкості','м/с'],y:['t','Час','с']},
 {n:'Сила',f:'F = m · a',t:'p',r:['F','Сила','Н'],x:['m','Маса','кг'],y:['a','Прискорення','м/с²']},
 {n:'Вага',f:'P = m · g',t:'p',r:['P','Вага','Н'],x:['m','Маса','кг'],y:['g','Прискорення вільного падіння','м/с²',9.81]},
 {n:'Густина (маса)',f:'ρ = m / V',t:'q',r:['ρ','Густина','кг/м³'],x:['m','Маса','кг'],y:['V','Об’єм','м³']},
 {n:'Тиск',f:'p = F / S',t:'q',r:['p','Тиск','Па'],x:['F','Сила','Н'],y:['S','Площа','м²']},
 {n:'Робота',f:'A = F · s',t:'p',r:['A','Робота','Дж'],x:['F','Сила','Н'],y:['s','Шлях','м']},
 {n:'Потужність',f:'P = A / t',t:'q',r:['P','Потужність','Вт'],x:['A','Робота','Дж'],y:['t','Час','с']},
 {n:'Імпульс',f:'p = m · v',t:'p',r:['p','Імпульс','кг·м/с'],x:['m','Маса','кг'],y:['v','Швидкість','м/с']},
 {n:'Кінетична енергія',f:'E = m · v² / 2',t:'k',r:['E','Енергія','Дж'],x:['m','Маса','кг'],y:['v','Швидкість','м/с']},
 {n:'Закон Ома',f:'U = I · R',t:'p',r:['U','Напруга','В'],x:['I','Струм','А'],y:['R','Опір','Ом']}
];
function solve(F,V){
  const r=F.r[0],x=F.x[0],y=F.y[0],miss=[r,x,y].filter(k=>V[k]==null);
  if(miss.length!==1)return null;
  const m=miss[0],R=V[r],X=V[x],Y=V[y];let v;
  if(F.t==='p')v=m===r?X*Y:m===x?R/Y:R/X;
  else if(F.t==='q')v=m===r?X/Y:m===x?R*Y:X/R;
  else v=m===r?X*Y*Y/2:m===x?2*R/(Y*Y):Math.sqrt(2*R/X);
  return [m,v];
}

}

  if(bad){$('#fr').textContent='Введіть тільки числа';return}

  if(!s){$('#fr').textContent='Залиште порожнім рівно одне поле';return}
  if(!isFinite(s[1])){$('#fr').textContent='Неможливо порахувати (ділення на нуль)';return}
  const val=+s[1].toPrecision(8),a=[F.r,F.x,F.y].find(q=>q[0]===s[0]);

};

const QU={
 v:['Швидкість','v',[['м/с',1],['км/год',1/3.6]]],
 s:['Шлях','s',[['м',1],['км',1000],['см',0.01]]],
 t:['Час','t',[['с',1],['хв',60],['год',3600]]],
 a:['Прискорення','a',[['м/с²',1]]],
 m:['Маса','m',[['кг',1],['г',0.001],['т',1000]]],
 F:['Сила','F',[['Н',1],['кН',1000]]],
 W:['Вага','P',[['Н',1],['кН',1000]]],
 g:['Вільне падіння','g',[['м/с²',1]]],
 rho:['Густина','ρ',[['кг/м³',1],['г/см³',1000]]],
 V:['Об’єм','V',[['м³',1],['л',0.001],['см³',1e-6]]],
 p:['Тиск','p',[['Па',1],['кПа',1000]]],
 S:['Площа','S',[['м²',1],['см²',1e-4]]],
 A:['Робота','A',[['Дж',1],['кДж',1000]]],
 N:['Потужність','N',[['Вт',1],['кВт',1000]]],
 J:['Імпульс','J',[['кг·м/с',1]]],
 E:['Енергія','E',[['Дж',1],['кДж',1000]]],
 U:['Напруга','U',[['В',1]]],
 I:['Струм','I',[['А',1],['мА',0.001]]],
 R:['Опір','R',[['Ом',1],['кОм',1000]]]
};
const FP=[{t:'q',r:'v',x:'s',y:'t'},{t:'q',r:'a',x:'v',y:'t'},{t:'p',r:'F',x:'m',y:'a'},{t:'p',r:'W',x:'m',y:'g'},{t:'q',r:'rho',x:'m',y:'V'},{t:'q',r:'p',x:'F',y:'S'},{t:'p',r:'A',x:'F',y:'s'},{t:'q',r:'N',x:'A',y:'t'},{t:'p',r:'J',x:'m',y:'v'},{t:'k',r:'E',x:'m',y:'v'},{t:'p',r:'U',x:'I',y:'R'}];
const TP={p:{r:'X · Y',x:'R / Y',y:'R / X'},q:{r:'X / Y',x:'R · Y',y:'X / R'},k:{r:'X · Y² / 2',x:'2 · R / Y²',y:'√(2 · R / X)'}};
const fm=n=>String(+n.toPrecision(6)).replace('.',','),sym=k=>QU[k][1],un=k=>QU[k][2][0][0];
function sv(F,m,V){const R=V[F.r],X=V[F.x],Y=V[F.y];
  if(F.t==='p')return m===F.r?X*Y:m===F.x?R/Y:R/X;
  if(F.t==='q')return m===F.r?X/Y:m===F.x?R*Y:X/R;
  return m===F.r?X*Y*Y/2:m===F.x?2*R/(Y*Y):Math.sqrt(2*R/X)}
function solveP(G,t){
  const V=Object.assign({},G),steps=[];let auto=false;
  if(t!=='g'&&V.g==null){V.g=9.81;auto=true}
  let prog=true;
  while(prog&&V[t]==null){prog=false;
    for(const F of FP){const ks=[F.r,F.x,F.y],miss=ks.filter(k=>V[k]==null);
      if(miss.length===1){const m=miss[0],v=sv(F,m,V);
        if(!isFinite(v))return {err:'Неможливо порахувати: ділення на нуль або від’ємне число під коренем.'};
        V[m]=v;steps.push({F,m,ins:ks.filter(k=>k!==m)});prog=true;break}}}
  if(V[t]==null)return {err:'Не вистачає даних: з цих величин знайти «'+QU[t][0]+'» не вдається. Додайте ще дано.'};
  const need=new Set([t]),used=[];
  for(let i=steps.length-1;i>=0;i--){const s=steps[i];if(need.has(s.m)){used.unshift(s);s.ins.forEach(k=>need.add(k))}}
  return {V,used,auto:auto&&used.some(s=>s.ins.includes('g'))};
}
function qOpts(){return Object.keys(QU).map(k=>'<option value="'+k+'">'+QU[k][0]+' ('+QU[k][1]+')</option>').join('')}
function uOpts(k){return QU[k][2].map((u,i)=>'<option value="'+i+'">'+u[0]+'</option>').join('')}

$('#ps').onclick=()=>{
  const G={},L=['Дано:'];let bad='';
  $$('#pg .pr').forEach(d=>{const k=d.querySelector('.pq').value,s=d.querySelector('.pv').value.trim().replace(',','.'),ui=+d.querySelector('.pu').value;
    if(s==='')return;const n=Number(s);if(isNaN(n)){bad='Введіть тільки числа';return}
    const f=QU[k][2][ui][1],si=n*f;G[k]=si;
    L.push(sym(k)+' = '+fm(n)+' '+QU[k][2][ui][0]+(f!==1?' = '+fm(si)+' '+un(k):''))});
  if(bad){$('#po').textContent=bad;return}
  if(!Object.keys(G).length){$('#po').textContent='Додайте хоча б одну величину в «Дано».';return}
  const t=$('#pt').value,ti=+$('#ptu').value,tf=QU[t][2][ti][1],tn=QU[t][2][ti][0];
  const r=solveP(G,t);
  if(r.err){$('#po').textContent=r.err;return}
  if(r.auto)L.push('g = 9,81 м/с² (стала)');
  L.push('','Знайти: '+sym(t)+' ('+QU[t][0].toLowerCase()+')','','Розв’язання:');
  if(!r.used.length)L.push('Величина вже є в «Дано».');
  r.used.forEach((s,i)=>{const T=TP[s.F.t],pos=s.m===s.F.r?'r':s.m===s.F.x?'x':'y',M={R:s.F.r,X:s.F.x,Y:s.F.y};
    L.push((i+1)+') '+sym(s.m)+' = '+T[pos].replace(/[RXY]/g,c=>sym(M[c]))+' = '+T[pos].replace(/[RXY]/g,c=>fm(r.V[M[c]]))+' = '+fm(r.V[s.m])+' '+un(s.m))});
  L.push('','Відповідь: '+sym(t)+' = '+fm(r.V[t]/tf)+' '+tn);
  $('#po').textContent=L.join('\n');
};

let LP;
function native(){const C=window.Capacitor;return !!(C&&C.isNativePlatform&&C.isNativePlatform())}
function pl(n){const C=window.Capacitor;return (C.Plugins&&C.Plugins[n])||(C.registerPlugin&&C.registerPlugin(n))}

function applyHide(){try{if(native())plug().hideSelf({hide:!!S.hideself}).catch(()=>{})}catch(e){}}

async function launch(a){
  S.last=a.p;save();apps();
  const C=window.Capacitor,msg=t=>{$('#msg').textContent=t};
  if(!native()){msg('Запуск програм працює тільки в APK');return}
  msg('Запускаю: '+a.n+'…');
  let m='';
  try{
    if(S.back||S.timer>0){
      let ok=false;try{ok=(await plug().canOverlay()).ok}catch(x){}
      if(S.timer>0&&!ok){await plug().askOverlay();msg('Для таймера дозволь «Показувати поверх інших програм» і натисни плитку ще раз');return}
      if(ok)await plug().showBack();
      if(S.timer>0)await plug().startTimer({sec:S.timer,pkg:a.p});
    }
    await Promise.race([plug().open({pkg:a.p,hide:!!S.hide}),new Promise((_,rej)=>setTimeout(()=>rej(new Error('немає відповіді 4 с')),4000))]);
    msg('Відкрито: '+a.n);return;
  }catch(e){m=(e&&e.message)||String(e)}
  unback();
  msg('Launch: '+m+' | плагіни: '+hdrs());
  try{const r=await pl('AppLauncher').openUrl({url:a.p});msg('Launch: '+m+' | AppLauncher: '+JSON.stringify(r)+' | плагіни: '+hdrs())}
  catch(x){msg('Launch: '+m+' | AppLauncher: '+((x&&x.message)||String(x))+' | плагіни: '+hdrs())}
}
